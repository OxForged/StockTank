packages:
  - apps/*
  - services/*
  - packages/*

autoInstallPeers: true

allowBuilds:
  msgpackr-extract: true
  ffmpeg-static: true
  ffprobe-static: true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.103.1'
  - '@tanstack/react-query@5.103.1'
  - prettier@3.9.7
  - '@aws-sdk/client-s3@3.1134.0'
  - '@aws-sdk/s3-request-presigner@3.1134.0'
