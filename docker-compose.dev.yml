name: stocktank-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stocktank
      POSTGRES_PASSWORD: stocktank_dev
      POSTGRES_DB: stocktank
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocktank -d stocktank"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  meilisearch:
    image: getmeili/meilisearch:v1.16
    environment:
      MEILI_MASTER_KEY: stocktank_dev_master_key
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: [meilidata:/meili_data]
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stocktank
      MINIO_ROOT_PASSWORD: stocktank_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
